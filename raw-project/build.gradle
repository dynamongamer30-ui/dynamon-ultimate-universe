// Legacy AIDE-friendly preview project. No third-party runtime dependencies.
buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:3.2.1' }
}
apply plugin: 'com.android.application'
android {
    compileSdkVersion 28
    defaultConfig {
        applicationId 'com.dynamongamer.royalvoid.preview'
        minSdkVersion 19
        targetSdkVersion 28
        versionCode 3
        versionName '0.3.0'
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src', 'preview']
            assets.srcDirs = ['assets']
            res.srcDirs = []
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
    aaptOptions { noCompress 'wav' }
    buildTypes { release { minifyEnabled true; proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro' } }
}
