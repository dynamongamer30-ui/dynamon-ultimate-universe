name: VEXTRO BOT Windows Package

on:
  push:
    branches: [main]
    paths:
      - "apps/vextro-bot/**"
      - ".github/workflows/vextro-bot-package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vextro-bot-package-main
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/vextro-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/vextro-bot/package.json
      - name: Install and generate reproducible lockfile
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Assemble Windows-ready package
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/release/VEXTRO-BOT"
          mkdir -p "$OUT"
          cp -R dist src tests "$OUT/"
          cp package.json package-lock.json tsconfig.json vitest.config.ts README.md .env.example INSTALL.bat START.bat DEPLOYMENT-WINDOWS.md "$OUT/"
          cat > "$OUT/BUILD-INFO.txt" <<EOF
          VEXTRO BOT Windows deployment package
          Repository: dynamongamer30-ui/dynamon-ultimate-universe
          Branch: main
          Commit: $GITHUB_SHA
          Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Node.js: 26
          CI: TypeScript + Vitest + production build passed before packaging
          EOF
          cd "$GITHUB_WORKSPACE/release"
          zip -qr "$GITHUB_WORKSPACE/VEXTRO-BOT-Windows.zip" VEXTRO-BOT
      - uses: actions/upload-artifact@v4
        with:
          name: VEXTRO-BOT-Windows
          path: VEXTRO-BOT-Windows.zip
          if-no-files-found: error
          retention-days: 30
