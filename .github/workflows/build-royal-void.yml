name: Build Royal Void DEX
on:
  workflow_dispatch:
  push:
    paths: ['Royal-Void-0.3.0-Java-And-Assets.zip', 'src/**', 'assets/royal_void/**', 'tools/build_dex*', 'tools/package_dex_release.sh', 'proguard-rules.pro', '.github/workflows/build-royal-void.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Extract client source
        run: unzip -q -o Royal-Void-0.3.0-Java-And-Assets.zip
      - name: Install selected Android tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build obfuscated injection package
        env:
          DG_SOURCE_LEVEL: '8'
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          export R8_JAR="$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar"
          bash tools/build_dex_release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Royal-Void-DEX-And-Assets
          path: dist/royal-void-dex-package.zip
          retention-days: 7
          if-no-files-found: error
      - name: Publish compiled package on download branch
        if: github.ref_name == 'royal-void-downloads-20261009'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import base64,json,os,urllib.request,urllib.error
          from pathlib import Path
          repo=os.environ['GH_REPOSITORY'];branch=os.environ['GH_BRANCH']
          name='Royal-Void-0.3.0-DEX-And-Assets.zip'
          url='https://api.github.com/repos/'+repo+'/contents/'+name
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          body={'message':'Publish compiled Royal Void 0.3 DEX and runtime assets','branch':branch,'content':base64.b64encode(Path('dist/royal-void-dex-package.zip').read_bytes()).decode()}
          try:
              with urllib.request.urlopen(urllib.request.Request(url+'?ref='+branch,headers=headers)) as r: body['sha']=json.load(r)['sha']
          except urllib.error.HTTPError as e:
              if e.code!=404:raise
          with urllib.request.urlopen(urllib.request.Request(url,data=json.dumps(body).encode(),headers={**headers,'Content-Type':'application/json'},method='PUT')) as r:result=json.load(r)
          print('Published compiled ZIP at commit '+result['commit']['sha'])
          PY
