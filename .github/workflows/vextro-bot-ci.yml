name: VEXTRO BOT CI

on:
  push:
    branches: [main]
    paths:
      - "apps/vextro-bot/**"
      - ".github/workflows/vextro-bot-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/vextro-bot/**"
      - ".github/workflows/vextro-bot-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vextro-bot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/vextro-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/vextro-bot/package.json
      - name: Install bot dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
