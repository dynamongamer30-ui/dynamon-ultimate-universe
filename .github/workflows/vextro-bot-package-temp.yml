name: VEXTRO BOT clean package
on:
  push:
    paths:
      - ".github/workflows/vextro-bot-package-temp.yml"
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install and verify full source
        working-directory: apps/vextro-bot
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
      - name: Create production-ready clean manifest
        working-directory: apps/vextro-bot
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json','utf8')); delete p.scripts.test; delete p.scripts.dev; delete p.devDependencies.vitest; delete p.devDependencies.tsx; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');"
          npm install --package-lock-only
      - name: Assemble clean package
        run: |
          mkdir -p staging/VEXTRO-BOT/supabase/migrations
          cp -R apps/vextro-bot/src staging/VEXTRO-BOT/src
          cp -R apps/vextro-bot/dist staging/VEXTRO-BOT/dist
          cp apps/vextro-bot/package.json apps/vextro-bot/package-lock.json apps/vextro-bot/tsconfig.json apps/vextro-bot/.env.example staging/VEXTRO-BOT/
          cp supabase/migrations/*vextro*.sql staging/VEXTRO-BOT/supabase/migrations/
          cd staging
          zip -qr ../VEXTRO-BOT-Revision21.zip VEXTRO-BOT
          unzip -l ../VEXTRO-BOT-Revision21.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VEXTRO-BOT-Revision21
          path: VEXTRO-BOT-Revision21.zip
          if-no-files-found: error
          retention-days: 7
