name: Neon API test Worker

on:
  pull_request:
    branches: [main]
    paths:
      - "workers/neon-api/**"
      - ".github/workflows/neon-api-test.yml"
  push:
    branches: ["neon/cloudflare-api-test-20261020"]
    paths:
      - "workers/neon-api/**"
      - ".github/workflows/neon-api-test.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/neon-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/neon-api/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
