plugins { id 'com.android.application' }
android {
    namespace 'com.dynamongamer.containerprobe'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.dynamongamer.containerprobe'
        minSdk 24
        targetSdk 28
        versionCode 2
        versionName '0.1.1-experimental'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        debug {
            storeFile file('../build/keys/development.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packaging { jniLibs { useLegacyPackaging true } }
}
dependencies {
    implementation files('libs/SpaceCore-SDK.aar')
    implementation 'com.tencent:mmkv-static:1.2.10'
    implementation 'com.google.code.gson:gson:2.9.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.5.30'
    implementation 'androidx.appcompat:appcompat:1.3.1'
}
